<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ES234103 · Propositional Logic Mock Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
      /* ---- light theme: warm paper + dark glass accent (inverse of the dark-mode) ---- */
      --paper: #ECE6D8;
      --paper-raised: rgba(255,255,255,0.62);
      --paper-solid: #FAF7F0;
      --ink: #211D17;
      --ink-soft: #6E6455;
      --rule: rgba(33,29,23,0.12);
      --rule-strong: rgba(33,29,23,0.22);
      --accent-fill: #211D17;      /* primary pill button background */
      --accent-fill-text: #F3ECDD; /* text on primary pill button */
      --accent: #B8492F;           /* terracotta — timer/flags/danger */
      --accent-soft: rgba(184,73,47,0.14);
      --good: #3F6F49;
      --good-soft: rgba(63,111,73,0.14);
      --warn: #93691A;
      --warn-soft: rgba(147,105,26,0.16);
      --focus: #211D17;
      --blob1: rgba(184,73,47,0.20);
      --blob2: rgba(232,196,132,0.28);
      --blob3: rgba(63,111,73,0.10);
      --radius: 18px;
      --radius-sm: 10px;
      --serif: 'Source Serif 4', Georgia, serif;
      --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --sidebar-w: 232px;
      --shadow-soft: 0 1px 2px rgba(33,29,23,0.06), 0 8px 24px rgba(33,29,23,0.06);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #14120E;
        --paper-raised: rgba(255,255,255,0.06);
        --paper-solid: #1E1A14;
        --ink: #F3ECDD;
        --ink-soft: #AFA48F;
        --rule: rgba(255,255,255,0.10);
        --rule-strong: rgba(255,255,255,0.20);
        --accent-fill: #F3ECDD;
        --accent-fill-text: #17140F;
        --accent: #E38A6D;
        --accent-soft: rgba(227,138,109,0.16);
        --good: #9BC7A0;
        --good-soft: rgba(155,199,160,0.14);
        --warn: #E3B35C;
        --warn-soft: rgba(227,179,92,0.16);
        --focus: #F3ECDD;
        --blob1: rgba(227,138,109,0.30);
        --blob2: rgba(232,196,132,0.22);
        --blob3: rgba(120,150,130,0.18);
        --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #14120E;
      --paper-raised: rgba(255,255,255,0.06);
      --paper-solid: #1E1A14;
      --ink: #F3ECDD;
      --ink-soft: #AFA48F;
      --rule: rgba(255,255,255,0.10);
      --rule-strong: rgba(255,255,255,0.20);
      --accent-fill: #F3ECDD;
      --accent-fill-text: #17140F;
      --accent: #E38A6D;
      --accent-soft: rgba(227,138,109,0.16);
      --good: #9BC7A0;
      --good-soft: rgba(155,199,160,0.14);
      --warn: #E3B35C;
      --warn-soft: rgba(227,179,92,0.16);
      --focus: #F3ECDD;
      --blob1: rgba(227,138,109,0.30);
      --blob2: rgba(232,196,132,0.22);
      --blob3: rgba(120,150,130,0.18);
      --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      position: relative;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    a { color: inherit; }
    button { font-family: inherit; }

    h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0 0 .4em; letter-spacing: -0.01em; }
    .mono, .expr { font-family: var(--mono); }

    /* ---------- decorative background blobs (pure CSS, no external image) ---------- */
    .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-blobs span { position: absolute; border-radius: 50%; filter: blur(90px); }
    .bg-blobs span:nth-child(1) { width: 620px; height: 620px; left: -160px; top: -180px; background: var(--blob1); }
    .bg-blobs span:nth-child(2) { width: 520px; height: 520px; right: -140px; top: 8%; background: var(--blob2); }
    .bg-blobs span:nth-child(3) { width: 560px; height: 560px; left: 20%; bottom: -220px; background: var(--blob3); }

    /* ---------- shell ---------- */
    .app-shell { display: flex; min-height: 100vh; max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
    .sidenav {
      width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
      margin: 22px 0 22px 16px;
      padding: 18px 14px;
      display: flex; flex-direction: column; gap: 5px;
      position: sticky; top: 22px; align-self: flex-start; height: calc(100vh - 44px);
      background: var(--paper-raised);
      -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }
    .brand { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; line-height: 1.25; margin-bottom: 10px; padding: 0 8px; }
    .brand small { display:block; font-family: var(--sans); font-weight: 500; color: var(--ink-soft); font-size: .72rem; margin-top: 2px; letter-spacing: .01em;}
    .navlink {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 999px;
      color: var(--ink-soft); text-decoration: none; cursor: pointer;
      font-size: .89rem; font-weight: 500; border: 1px solid transparent; background: none; text-align:left; width:100%;
      transition: background .15s ease, color .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    .navlink:hover { background: var(--rule); color: var(--ink); transform: translateX(2px); }
    .navlink.active { color: var(--accent-fill-text); background: var(--accent-fill); font-weight: 600; box-shadow: var(--shadow-soft); }
    .navlink.active:hover { transform: none; }
    .navlink .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-strong); flex-shrink:0; }
    .navlink.active .dot { background: var(--accent-fill-text); }
    .sidenav-footer { margin-top: auto; padding: 8px; display:flex; flex-direction:column; gap:10px; }
    .theme-toggle {
      display: flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; font-size: .75rem;
      background: var(--paper-solid); padding: 3px; gap: 2px;
    }
    .theme-toggle button { flex:1; padding: 7px 0; background: transparent; color: var(--ink-soft); border: none; cursor: pointer; border-radius: 999px; transition: all .18s cubic-bezier(.2,.8,.2,1); }
    .theme-toggle button:hover { color: var(--ink); }
    .theme-toggle button.active { background: var(--accent-fill); color: var(--accent-fill-text); font-weight: 600; box-shadow: var(--shadow-soft); }

    main { flex: 1; min-width: 0; padding: 28px 32px 60px; position: relative; z-index: 1; }
    .page-head { margin-bottom: 22px; }
    .page-head p { color: var(--ink-soft); max-width: 62ch; margin: 6px 0 0; }

    /* ---------- cards ---------- */
    .card {
      background: var(--paper-raised);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--rule); border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow-soft);
    }
    .card + .card { margin-top: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat-card { padding: 18px 20px; }
    .stat-num { font-family: var(--serif); font-size: 2.1rem; font-weight: 700; line-height: 1; }
    .stat-label { color: var(--ink-soft); font-size: .78rem; margin-top: 8px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content:center;
      padding: 10px 20px; border-radius: 999px; border: 1px solid transparent;
      background: var(--paper-solid); color: var(--ink); font-weight: 600; font-size: .87rem;
      cursor: pointer; text-decoration: none; border: 1px solid var(--rule-strong);
      transition: transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s ease, background .15s ease, filter .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .btn:active { transform: translateY(0) scale(.97); box-shadow: none; }
    .btn.secondary { background: transparent; color: var(--ink); border-color: var(--rule-strong); font-weight: 500; }
    .btn.secondary:hover { background: var(--rule); }
    .btn.accent, .btn:not(.secondary) {
      background: var(--accent-fill); color: var(--accent-fill-text); border-color: transparent;
    }
    .btn.accent:hover, .btn:not(.secondary):hover { filter: brightness(1.06); box-shadow: 0 10px 28px -6px var(--accent-soft), var(--shadow-soft); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .badge { display:inline-block; padding: 3px 12px; border-radius: 999px; font-size: .72rem; font-weight: 600; border: 1px solid transparent; }
    .badge.easy { background: var(--good-soft); color: var(--good); }
    .badge.medium { background: var(--warn-soft); color: var(--warn); }
    .badge.hard { background: var(--accent-soft); color: var(--accent); }

    /* ---------- exam session ---------- */
    .exam-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 16px; border: 1px solid var(--rule); border-radius: 999px;
      background: var(--paper-raised); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      margin-bottom: 16px; flex-wrap: wrap; box-shadow: var(--shadow-soft);
    }
    .timer { font-family: var(--mono); font-size: 1.1rem; font-weight: 600; padding: 6px 16px; border-radius: 999px; background: var(--paper-solid); border: 1px solid var(--rule); transition: color .2s, border-color .2s; }
    .timer.low { color: var(--accent); border-color: var(--accent); animation: pulseLow 1s ease-in-out infinite; }
    @keyframes pulseLow { 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
    .progress-track { flex:1; height: 6px; background: var(--rule); border-radius: 999px; overflow:hidden; min-width: 120px; }
    .progress-fill { height: 100%; background: var(--accent-fill); border-radius: 999px; transition: width .3s cubic-bezier(.2,.8,.2,1); }

    .qnav-strip { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .qnav-dot {
      width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--rule);
      background: var(--paper-raised); color: var(--ink-soft); font-family: var(--mono); font-size: .78rem;
      display:flex; align-items:center; justify-content:center; cursor:pointer; position: relative;
      transition: transform .12s cubic-bezier(.2,.8,.2,1), background .15s, color .15s, box-shadow .15s;
    }
    .qnav-dot:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); color: var(--ink); }
    .qnav-dot.current { border-color: var(--accent-fill); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 2px var(--accent-fill) inset; }
    .qnav-dot.answered { background: var(--good-soft); color: var(--good); border-color: transparent; }
    .qnav-dot.flagged::after { content: ''; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background: var(--accent); box-shadow: 0 0 0 2px var(--paper); }

    .qcard { padding: 28px 30px; }
    .qcard-head { display:flex; align-items:flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .qnum { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--ink); }
    .qmeta { display:flex; gap:6px; align-items:center; flex-wrap: wrap; }
    .qprompt { white-space: pre-line; font-size: 1.02rem; margin-bottom: 18px; }
    .flag-btn {
      background: var(--paper-solid); border: 1px solid var(--rule-strong); border-radius: 999px; padding: 7px 14px; cursor: pointer;
      color: var(--ink-soft); font-size:.8rem; transition: transform .15s cubic-bezier(.2,.8,.2,1), background .15s, color .15s, box-shadow .15s;
    }
    .flag-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); color: var(--ink); }
    .flag-btn.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

    .option-row {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin-bottom: 9px;
      border: 1px solid var(--rule); border-radius: var(--radius-sm); cursor: pointer; background: var(--paper-solid);
      transition: transform .13s cubic-bezier(.2,.8,.2,1), border-color .15s, background .15s, box-shadow .15s;
    }
    .option-row:hover { border-color: var(--rule-strong); transform: translateY(-2px) translateX(2px); box-shadow: var(--shadow-soft); }
    .option-row:active { transform: translateY(0) translateX(0) scale(.995); }
    .option-row.selected { border-color: var(--accent-fill); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-fill); }
    .option-letter {
      width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule-strong); flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-family: var(--mono); font-size: .75rem; color: var(--ink-soft);
      transition: background .15s, color .15s, border-color .15s;
    }
    .option-row.selected .option-letter { background: var(--accent-fill); color: var(--accent-fill-text); border-color: transparent; }
    .option-text { font-family: var(--mono); font-size: .95rem; }

    .tf-row { display:flex; gap: 12px; }
    .tf-btn {
      flex:1; padding: 17px; text-align:center; border: 1px solid var(--rule); border-radius: var(--radius-sm); cursor:pointer; font-weight:600; background: var(--paper-solid);
      transition: transform .13s cubic-bezier(.2,.8,.2,1), border-color .15s, background .15s, box-shadow .15s;
    }
    .tf-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .tf-btn:active { transform: translateY(0) scale(.98); }
    .tf-btn.selected { border-color: var(--accent-fill); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-fill); }

    .symbolic-input { width: 100%; padding: 13px 16px; font-family: var(--mono); font-size: 1rem; border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); background: var(--paper-solid); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
    .symbolic-input:focus { outline: none; border-color: var(--accent-fill); box-shadow: 0 0 0 3px var(--accent-soft); }
    .symbolic-hint { color: var(--ink-soft); font-size: .78rem; margin-top: 8px; }
    .symbolic-preview { margin-top: 10px; font-family: var(--mono); font-size: .95rem; padding: 9px 14px; background: var(--paper-solid); border: 1px dashed var(--rule-strong); border-radius: var(--radius-sm); }

    table.tt-table { border-collapse: separate; border-spacing: 0; width: 100%; font-family: var(--mono); font-size: .92rem; margin-top: 4px; background: var(--paper-solid); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--rule); }
    table.tt-table th, table.tt-table td { border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 9px 12px; text-align: center; }
    table.tt-table th:last-child, table.tt-table td:last-child { border-right: none; }
    table.tt-table tr:last-child td { border-bottom: none; }
    table.tt-table th { background: var(--rule); font-weight: 600; }
    .tt-toggle { display:inline-flex; border:1px solid var(--rule-strong); border-radius: 999px; overflow:hidden; }
    .tt-toggle button { padding: 4px 12px; border: none; background: var(--paper-raised); cursor: pointer; font-family: var(--mono); font-size: .82rem; color: var(--ink-soft); transition: background .15s, color .15s; }
    .tt-toggle button:hover { color: var(--ink); }
    .tt-toggle button.active { background: var(--accent-fill); color: var(--accent-fill-text); }

    .proof-chain { display: flex; flex-direction: column; gap: 0; }
    .proof-line { display:flex; align-items:center; gap: 14px; padding: 12px 4px; border-bottom: 1px dashed var(--rule); flex-wrap: wrap; }
    .proof-line:last-child { border-bottom: none; }
    .proof-expr { font-family: var(--mono); font-size: 1rem; min-width: 200px; }
    .proof-law-select { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--paper-solid); color: var(--ink); font-size: .85rem; min-width: 220px; transition: border-color .15s, box-shadow .15s; }
    .proof-law-select:focus { outline: none; border-color: var(--accent-fill); box-shadow: 0 0 0 3px var(--accent-soft); }
    .proof-arrow { color: var(--ink-soft); font-family: var(--mono); }

    .explain-box { background: var(--paper-solid); border-left: 3px solid var(--ink); padding: 15px 18px; border-radius: var(--radius-sm); margin-top: 10px; white-space: pre-line; font-size: .9rem; }
    .explain-box.correct { border-left-color: var(--good); }
    .explain-box.incorrect { border-left-color: var(--accent); }

    /* ---------- results ---------- */
    .score-hero { display:flex; align-items:center; gap: 28px; flex-wrap: wrap; }
    .score-ring { font-family: var(--serif); font-size: 3rem; font-weight: 700; }
    .bar-row { display:flex; align-items:center; gap: 10px; margin-bottom: 10px; }
    .bar-label { width: 190px; flex-shrink:0; font-size: .85rem; color: var(--ink-soft); }
    .bar-track { flex:1; height: 10px; background: var(--rule); border-radius: 999px; overflow:hidden; }
    .bar-fill { height:100%; border-radius: 999px; background: var(--accent-fill); transition: width .4s cubic-bezier(.2,.8,.2,1); }
    .bar-fill.good { background: var(--good); }
    .bar-fill.warn { background: var(--warn); }
    .bar-fill.bad { background: var(--accent); }
    .bar-pct { width: 46px; text-align:right; font-family: var(--mono); font-size: .82rem; color: var(--ink-soft); }

    .review-item { border: 1px solid var(--rule); background: var(--paper-solid); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
    .review-item.wrong { border-left: 3px solid var(--accent); }
    .review-item.right { border-left: 3px solid var(--good); }

    .tag-pill { display:inline-flex; align-items:center; gap:6px; background: var(--paper-solid); border:1px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-size:.8rem; margin: 3px 4px 3px 0; transition: transform .13s, box-shadow .15s; }
    .tag-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    .tag-pill b { font-family: var(--mono); }

    /* ---------- setup / practice ---------- */
    .choice-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 10px; }
    .choice-card {
      border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: 15px; cursor: pointer; background: var(--paper-solid);
      transition: transform .14s cubic-bezier(.2,.8,.2,1), border-color .15s, box-shadow .15s, background .15s;
    }
    .choice-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
    .choice-card:active { transform: translateY(-1px) scale(.98); }
    .choice-card.selected { border-color: var(--accent-fill); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-fill); }
    .choice-card h4 { margin:0 0 4px; font-size: .92rem; font-family: var(--sans); font-weight: 700; }
    .choice-card p { margin:0; color: var(--ink-soft); font-size: .78rem; }

    /* ---------- modal ---------- */
    .modal-overlay { position: fixed; inset:0; background: rgba(10,8,6,.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center; z-index: 50; padding: 20px; }
    .modal-box { background: var(--paper-solid); border-radius: var(--radius); max-width: 440px; width:100%; padding: 26px; border: 1px solid var(--rule); box-shadow: var(--shadow-soft); }
    .modal-box h3 { margin-bottom: 10px; }
    .modal-box p { color: var(--ink-soft); font-size: .9rem; }

    .empty-state { text-align:center; padding: 50px 20px; color: var(--ink-soft); }
    .empty-state h3 { color: var(--ink); }

    ::selection { background: var(--accent-soft); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

    .theme-cycle-btn { display: none; }

    /* ---------- responsive ---------- */
    @media (max-width: 860px) {
      .app-shell { flex-direction: column; }
      .sidenav {
        position: fixed; bottom: 0; left:0; right:0; top:auto; height:auto; width:100%;
        flex-direction: row; align-items:center; margin: 0;
        padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
        border-radius: 0; border-left:none; border-right:none; border-bottom:none;
        z-index: 40; overflow-x:auto; gap: 2px;
      }
      .brand, .sidenav-footer { display:none; }
      .theme-cycle-btn { display: flex; }
      .navlink { flex-direction: column; font-size: .64rem; padding: 8px 10px; gap:4px; white-space:nowrap; }
      .navlink:hover { transform: none; }
      main { padding: 18px 16px 100px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .score-hero { gap: 16px; }
      .bar-label { width: 130px; }
    }

</style>

// ============================================================
// Propositional Logic Engine
// AST: {op:'VAR',name} | {op:'NOT',a} | {op:'AND'|'OR'|'XOR'|'IMP'|'IFF',a,b}
// ============================================================
const Logic = (function () {
  function V(name) { return { op: 'VAR', name }; }
  const TRUE = { op: 'TRUE' };
  const FALSE = { op: 'FALSE' };
  function NOT(a) { return { op: 'NOT', a }; }
  function AND(a, b) { return { op: 'AND', a, b }; }
  function OR(a, b) { return { op: 'OR', a, b }; }
  function XOR(a, b) { return { op: 'XOR', a, b }; }
  function IMP(a, b) { return { op: 'IMP', a, b }; }
  function IFF(a, b) { return { op: 'IFF', a, b }; }

  function evalNode(node, assign) {
    switch (node.op) {
      case 'TRUE': return true;
      case 'FALSE': return false;
      case 'VAR': return !!assign[node.name];
      case 'NOT': return !evalNode(node.a, assign);
      case 'AND': return evalNode(node.a, assign) && evalNode(node.b, assign);
      case 'OR': return evalNode(node.a, assign) || evalNode(node.b, assign);
      case 'XOR': return evalNode(node.a, assign) !== evalNode(node.b, assign);
      case 'IMP': return (!evalNode(node.a, assign)) || evalNode(node.b, assign);
      case 'IFF': return evalNode(node.a, assign) === evalNode(node.b, assign);
      default: throw new Error('bad node');
    }
  }

  function collectVars(node, set) {
    set = set || new Set();
    if (node.op === 'VAR') set.add(node.name);
    else if (node.op === 'TRUE' || node.op === 'FALSE') { /* constant */ }
    else if (node.op === 'NOT') collectVars(node.a, set);
    else { collectVars(node.a, set); collectVars(node.b, set); }
    return set;
  }

  function truthTable(node, forcedVars) {
    const vars = forcedVars ? forcedVars.slice() : Array.from(collectVars(node)).sort();
    const n = vars.length;
    const rows = [];
    for (let i = 0; i < (1 << n); i++) {
      const assign = {};
      vars.forEach((v, idx) => { assign[v] = !!((i >> (n - 1 - idx)) & 1); });
      rows.push({ assign, value: evalNode(node, assign) });
    }
    return { vars, rows };
  }

  function isTautology(node) { return truthTable(node).rows.every(r => r.value === true); }
  function isContradiction(node) { return truthTable(node).rows.every(r => r.value === false); }
  function classify(node) {
    if (isTautology(node)) return 'tautology';
    if (isContradiction(node)) return 'contradiction';
    return 'contingency';
  }

  function equivalent(n1, n2) {
    const vars = Array.from(new Set([...collectVars(n1), ...collectVars(n2)])).sort();
    const n = vars.length;
    for (let i = 0; i < (1 << n); i++) {
      const assign = {};
      vars.forEach((v, idx) => { assign[v] = !!((i >> (n - 1 - idx)) & 1); });
      if (evalNode(n1, assign) !== evalNode(n2, assign)) return false;
    }
    return true;
  }

  const LEVEL = { NOT: 5, AND: 4, OR: 3, XOR: 3.5, IMP: 2, IFF: 1 };
  const SYM = { NOT: '¬', AND: '∧', OR: '∨', XOR: '⊕', IMP: '→', IFF: '↔' };

  function toStr(node, parentLevel) {
    parentLevel = parentLevel || 0;
    if (node.op === 'TRUE') return 'T';
    if (node.op === 'FALSE') return 'F';
    if (node.op === 'VAR') return node.name;
    if (node.op === 'NOT') return '¬' + toStr(node.a, LEVEL.NOT);
    const lvl = LEVEL[node.op];
    const bumpRight = (node.op === 'IMP' || node.op === 'IFF') ? 0.01 : 0;
    const s = toStr(node.a, lvl) + ' ' + SYM[node.op] + ' ' + toStr(node.b, lvl + bumpRight);
    return (lvl < parentLevel) ? '(' + s + ')' : s;
  }

  // substitute variable names (for randomizing letters in templates)
  function substitute(node, map) {
    if (node.op === 'TRUE' || node.op === 'FALSE') return node;
    if (node.op === 'VAR') return V(map[node.name] || node.name);
    if (node.op === 'NOT') return NOT(substitute(node.a, map));
    return { op: node.op, a: substitute(node.a, map), b: substitute(node.b, map) };
  }

  // ---- Parser: accepts unicode + ascii aliases ----
  function tokenize(str) {
    let s = str
      .replace(/<->|<=>|↔/g, ' IFF ')
      .replace(/->|=>|→/g, ' IMP ')
      .replace(/\bxor\b|⊕/gi, ' XOR ')
      .replace(/[∧&]/g, ' AND ')
      .replace(/[∨]/g, ' OR ')
      .replace(/[¬~!]/g, ' NOT ')
      .replace(/\(/g, ' ( ').replace(/\)/g, ' ) ');
    const parts = s.split(/\s+/).filter(Boolean);
    const tokens = [];
    for (let p of parts) {
      if (/^(AND|OR|NOT|IMP|IFF|XOR)$/i.test(p)) tokens.push(p.toUpperCase());
      else if (p === '(' || p === ')') tokens.push(p);
      else if (/^and$/i.test(p)) tokens.push('AND');
      else if (/^or$/i.test(p)) tokens.push('OR');
      else if (/^not$/i.test(p)) tokens.push('NOT');
      else if (p === 'T') tokens.push({ op: 'TRUE' });
      else if (p === 'F') tokens.push({ op: 'FALSE' });
      else if (/^[a-zA-Z][a-zA-Z0-9]*$/.test(p)) tokens.push({ op: 'VAR', name: p.toLowerCase() });
      else throw new Error('Unrecognized symbol: ' + p);
    }
    return tokens;
  }

  function parseExpr(str) {
    const tokens = tokenize(str);
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    function parseIff() {
      let left = parseImp();
      while (peek() === 'IFF') { next(); left = IFF(left, parseImp()); }
      return left;
    }
    function parseImp() {
      let left = parseOr();
      if (peek() === 'IMP') { next(); return IMP(left, parseImp()); }
      return left;
    }
    function parseOr() {
      let left = parseXor();
      while (peek() === 'OR') { next(); left = OR(left, parseXor()); }
      return left;
    }
    function parseXor() {
      let left = parseAnd();
      while (peek() === 'XOR') { next(); left = XOR(left, parseAnd()); }
      return left;
    }
    function parseAnd() {
      let left = parseNot();
      while (peek() === 'AND') { next(); left = AND(left, parseNot()); }
      return left;
    }
    function parseNot() {
      if (peek() === 'NOT') { next(); return NOT(parseNot()); }
      return parseAtom();
    }
    function parseAtom() {
      const t = peek();
      if (t === '(') { next(); const e = parseIff(); if (peek() !== ')') throw new Error('Expected )'); next(); return e; }
      if (t && typeof t === 'object' && (t.op === 'VAR' || t.op === 'TRUE' || t.op === 'FALSE')) { next(); return t; }
      throw new Error('Unexpected token');
    }
    if (tokens.length === 0) throw new Error('Empty expression');
    const result = parseIff();
    if (pos !== tokens.length) throw new Error('Trailing input after expression');
    return result;
  }

  function tryParse(str) {
    try { return { ok: true, node: parseExpr(str) }; }
    catch (e) { return { ok: false, error: e.message }; }
  }

  return {
    V, NOT, AND, OR, XOR, IMP, IFF,
    evalNode, collectVars, truthTable, isTautology, isContradiction, classify,
    equivalent, toStr, substitute, parseExpr, tryParse
  };
})();

      note: "Setting q = True, p = False satisfies all three.",
      inconsistentAddition: "p",
      src: 'L2 p.39'
    },
  ];

  // ---- Logic gates (L2 p.10, 43) ----
  const GATES = [
    { name: 'Inverter (NOT gate)', input: 'x', output: '¬x', desc: 'a single input line into a bubble-tipped triangle' },
    { name: 'OR gate', input: 'x, y', output: 'x ∨ y', desc: 'two input lines into a curved-back gate shape' },
    { name: 'AND gate', input: 'x, y', output: 'x ∧ y', desc: 'two input lines into a flat-back D-shaped gate' },
  ];

  return {
    PROP_ITEMS, CONTEXTS, WEATHER_TRANSLATIONS, SPEEDING_TRANSLATIONS, FREEZING_TRANSLATIONS,
    MULTI_VAR_TRANSLATIONS, COND_PHRASES, LAWS, LAW_BY_ID, PROOF_TEMPLATES, CONSISTENCY_SCENARIOS, GATES
  };

<script>
// ============================================================
// Question generators. Each generator returns a question object:
// { qtype, difficulty, topic, prompt, render-data..., correct, explanation, mistakeTag, lawTrace? }
// qtype in: mcq | tf | symbolic | truthtable | selectexpr | equivalence | proof | consistency
// ============================================================
const QGEN = (function () {
  const { parseExpr, toStr, equivalent, classify, truthTable, substitute, evalNode } = Logic;

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pickN(arr, n) { const c = arr.slice(); const out = []; while (out.length < n && c.length) { out.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]); } return out; }
  function shuffle(arr) { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[c[i], c[j]] = [c[j], c[i]]; } return c; }
  function uid() { return 'q' + Math.random().toString(36).slice(2, 10); }

  const VARPOOL = ['p', 'q', 'r', 's', 'm', 'n', 'u', 'w']; // 't','f' reserved as constants

  function randomVarMap(nativeLetters) {
    const chosen = pickN(VARPOOL, nativeLetters.length);
    const map = {};
    nativeLetters.forEach((l, i) => map[l] = chosen[i]);
    return map;
  }

  function fmtExpr(str) { return toStr(parseExpr(str)); }

  // ============================================================
  // EASY GENERATORS
  // ============================================================

  // E-1: Proposition vs non-proposition classification
  function genPropClassify() {
    const item = pick(DATA.PROP_ITEMS);
    const opts = ['True proposition', 'False proposition', 'Not a proposition'];
    const correctIdx = item.kind === 'true' ? 0 : item.kind === 'false' ? 1 : 2;
    return {
      qtype: 'mcq', difficulty: 'easy', topic: 'Propositions',
      prompt: `Classify the following sentence:\n\n“${item.text}”`,
      options: opts,
      correct: correctIdx,
      explanation: item.kind === 'not'
        ? `This sentence is not a proposition: it is ${/\?$/.test(item.text) ? 'a question' : /^(read|write|compute)/i.test(item.text) ? 'an instruction/command' : 'a statement whose truth value cannot be fixed because it contains an undetermined variable'}, so it cannot be assigned a single fixed truth value.`
        : `This is a declarative sentence with a definite, fixed truth value (${item.kind === 'true' ? 'True' : 'False'}), so it is a proposition.`,
      mistakeTag: 'prop-vs-nonprop',
    };
  }

  // E-2: Basic operator truth-value evaluation (single operator)
  function genBasicOperatorEval() {
    const ops = [
      { sym: 'NOT p', op: 'NOT' }, { sym: 'p AND q', op: 'AND' }, { sym: 'p OR q', op: 'OR' },
      { sym: 'p XOR q', op: 'XOR' }, { sym: 'p IMP q', op: 'IMP' }, { sym: 'p IFF q', op: 'IFF' },
    ];
    const chosen = pick(ops);
    const map = randomVarMap(chosen.op === 'NOT' ? ['p'] : ['p', 'q']);
    const pv = Math.random() < 0.5, qv = Math.random() < 0.5;
    const node = substitute(parseExpr(chosen.sym), map);
    const assign = {}; assign[map.p] = pv; if (map.q) assign[map.q] = qv;
    const val = evalNode(node, assign);
    const pName = map.p, qName = map.q;
    let givenStr = `${pName} = ${pv ? 'True' : 'False'}` + (qName ? `, ${qName} = ${qv ? 'True' : 'False'}` : '');
    return {
      qtype: 'tf', difficulty: 'easy', topic: 'Operators & Truth Values',
      prompt: `Given ${givenStr}, is the statement “${toStr(node)}” True or False?`,
      correct: val,
      explanation: `${toStr(node)} evaluates by the truth table for its operator: with ${givenStr}, the result is ${val ? 'True' : 'False'}.`,
      mistakeTag: 'operator-precedence',
    };
  }

  // E-3: Simple English -> symbol translation (single operator, weather/speeding/freezing contexts)
  function genSimpleTranslation() {
    const bank = pick([
      { list: DATA.WEATHER_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'weather') },
      { list: DATA.SPEEDING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'speeding') },
      { list: DATA.FREEZING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'freezing') },
    ]);
    const simpleOnes = bank.list.filter(it => !/AND NOT|OR|IMP|IFF/.test(it.expr) || (it.expr.match(/ /g) || []).length <= 2);
    const item = pick(simpleOnes.length ? simpleOnes : bank.list);
    const map = randomVarMap(['p', 'q']);
    const node = substitute(parseExpr(item.expr), map);
    const correctStr = toStr(node);
    const distractors = buildExprDistractors(node, map);
    const options = shuffle([correctStr, ...distractors.slice(0, 3)]);
    return {
      qtype: 'mcq', difficulty: 'easy', topic: 'Translation',
      prompt: `Let ${map.p} = "${bank.ctx.p}" and ${map.q} = "${bank.ctx.q}".\n\nWhich symbolic expression matches:\n“${item.text}”`,
      options,
      correct: options.indexOf(correctStr),
      explanation: `“${item.text}” translates directly to ${correctStr}, using ${map.p} = "${bank.ctx.p}" and ${map.q} = "${bank.ctx.q}".`,
      mistakeTag: 'translation',
    };
  }

  function buildExprDistractors(node, map) {
    const out = [];
    // swap AND/OR, negate one side, swap implication direction — all common-mistake distractors
    try { out.push(flipTopOp(node)); } catch (e) { }
    try { out.push(negateOneSide(node)); } catch (e) { }
    if (node.op === 'IMP') out.push({ op: 'IMP', a: node.b, b: node.a }); // reversed conditional (common mistake)
    // swapping the two named variables only yields a *distinct* statement when the
    // top operator is non-commutative (IMP); for AND/OR/XOR/IFF it reproduces the same
    // truth table and would create a duplicate "correct" option, so skip it there.
    if (map.p && map.q && node.op === 'IMP') {
      out.push(substitute(node, { [map.p]: map.q, [map.q]: map.p }));
    }
    // Final safety net: drop any candidate that is semantically equivalent to the
    // correct answer (would make the question ambiguous) or a literal string repeat.
    const correctStr = toStr(node);
    const seen = new Set([correctStr]);
    const cleaned = [];
    out.forEach(cand => {
      let s; try { s = toStr(cand); } catch (e) { return; }
      if (seen.has(s)) return;
      let eq = false; try { eq = equivalent(cand, node); } catch (e) { }
      if (eq) return;
      seen.add(s); cleaned.push(s);
    });
    return shuffle(cleaned).slice(0, 4);
  }
  function flipTopOp(node) {
    const swap = { AND: 'OR', OR: 'AND', IMP: 'IFF', IFF: 'IMP' };
    if (swap[node.op]) return { op: swap[node.op], a: node.a, b: node.b };
    if (node.op === 'NOT') return node.a;
    return { op: 'NOT', a: node };
  }
  function negateOneSide(node) {
    if (node.op === 'NOT' || node.op === 'VAR') return { op: 'NOT', a: node };
    return { op: node.op, a: { op: 'NOT', a: node.a }, b: node.b };
  }

  // E-4: Logic gate reading
  function genLogicGate() {
    const gate = pick(DATA.GATES);
    const isTwoInput = gate.input.includes(',');
    const map = randomVarMap(isTwoInput ? ['x', 'y'] : ['x']);
    const exprNode = substitute(parseExpr(gate.output.replace('¬', 'NOT ')), map);
    const correctStr = toStr(exprNode);
    let options;
    if (isTwoInput) {
      const wrongPool = DATA.GATES.filter(g => g !== gate && g.input.includes(',')).map(g => toStr(substitute(parseExpr(g.output.replace('¬', 'NOT ')), map)));
      options = shuffle([correctStr, ...pickN(wrongPool, Math.min(1, wrongPool.length)), toStr(substitute(parseExpr('x XOR y'), map)), toStr(substitute(parseExpr('NOT x AND NOT y'), map))]);
    } else {
      // single-input (Inverter): distractors must only reference the one real variable
      options = shuffle([correctStr, map.x, toStr(substitute(parseExpr('x AND x'), map))]);
    }
    options = options.filter((v, i, a) => a.indexOf(v) === i);
    const article = /^[AEIOU]/.test(gate.name) ? 'an' : 'a';
    return {
      qtype: 'mcq', difficulty: 'easy', topic: 'Logic Gates',
      prompt: `A circuit diagram shows ${article} ${gate.name}: ${gate.desc}, with input${isTwoInput ? 's' : ''} ${isTwoInput ? `${map.x} and ${map.y}` : map.x}.\n\nWhich boolean expression represents its output?`,
      options,
      correct: options.indexOf(correctStr),
      explanation: `${article[0].toUpperCase() + article.slice(1)} ${gate.name} outputs ${correctStr}, matching the standard gate definition from the lecture notes.`,
      mistakeTag: 'logic-gates',
    };
  }

  // ============================================================
  // MEDIUM GENERATORS
  // ============================================================

  // M-1: Complex translation with 2-3 variables (internet/roller-coaster contexts)
  function genComplexTranslation() {
    const item = pick(DATA.MULTI_VAR_TRANSLATIONS);
    const letters = Object.keys(item.vars);
    const map = randomVarMap(letters);
    const node = substitute(parseExpr(item.expr), map);
    const correctStr = toStr(node);
    const distractors = buildExprDistractors(node, map);
    const options = shuffle([correctStr, ...distractors.slice(0, 3)]).filter((v, i, a) => a.indexOf(v) === i);
    const legend = letters.map(l => `${map[l]} = "${item.vars[l]}"`).join('; ');
    return {
      qtype: 'mcq', difficulty: 'medium', topic: 'Translation',
      prompt: `Let ${legend}.\n\nWhich symbolic expression matches:\n“${item.text}”`,
      options, correct: options.indexOf(correctStr),
      explanation: `“${item.text}” translates to ${correctStr}. Watch for "only if" (translates to →, not ←) and "unless" (¬p in "q unless ¬p" means q holds whenever p is false).`,
      mistakeTag: 'translation',
    };
  }

  // M-2: Necessary / sufficient condition identification
  function genNecessarySufficient() {
    const ctx = pick(DATA.CONTEXTS);
    const map = randomVarMap(['p', 'q']);
    const phraseTemplate = pick(DATA.COND_PHRASES);
    const sentence = phraseTemplate.replace('{p}', ctx.p).replace('{q}', ctx.q);
    const askType = pick(['direction', 'necessary', 'sufficient']);
    if (askType === 'direction') {
      const options = shuffle([`${map.p} → ${map.q}`, `${map.q} → ${map.p}`, `${map.p} ↔ ${map.q}`, `${map.p} ∧ ${map.q}`]);
      const correctStr = `${map.p} → ${map.q}`;
      return {
        qtype: 'mcq', difficulty: 'medium', topic: 'Conditional Statements',
        prompt: `Let ${map.p} = "${ctx.p}" and ${map.q} = "${ctx.q}".\n\nWhich symbolic expression correctly captures:\n“${sentence}”`,
        options, correct: options.indexOf(correctStr),
        explanation: `The phrase "${phraseTemplate.replace('{p}', 'p').replace('{q}', 'q')}" is one of the standard phrasings of p → q from the lecture notes. A common mistake is reversing it to q → p — remember "p only if q" means p → q, not q → p.`,
        mistakeTag: 'necessary-sufficient',
      };
    } else {
      const isNecessary = askType === 'necessary';
      const options = [ctx.p, ctx.q].map(x => x);
      const correctLabel = isNecessary ? ctx.q : ctx.p;
      const distractorLabel = isNecessary ? ctx.p : ctx.q;
      const opts = shuffle([correctLabel, distractorLabel]);
      return {
        qtype: 'mcq', difficulty: 'medium', topic: 'Conditional Statements',
        prompt: `In the conditional statement "${map.p} → ${map.q}" (i.e. "If ${ctx.p}, then ${ctx.q}"), which condition is ${isNecessary ? 'necessary' : 'sufficient'}?`,
        options: opts.map(o => `${o === ctx.p ? map.p : map.q}: "${o}"`),
        correct: opts.indexOf(correctLabel),
        explanation: isNecessary
          ? `In p → q, q is the necessary condition: q must hold for p to hold (q is necessary for p).`
          : `In p → q, p is the sufficient condition: p being true guarantees q (p is sufficient for q).`,
        mistakeTag: 'necessary-sufficient',
      };
    }
  }

  // M-3: Truth table completion — ask for value of one row / one column cell
  function genTruthTableQuestion(forceCells) {
    const templates = [
      'p AND (q OR NOT r)', 'NOT p OR (q AND r)', '(p OR q) AND NOT r', 'p IMP (q AND r)',
      '(p AND q) OR (NOT p AND r)', 'NOT (p AND q) OR r', 'p XOR (q AND r)', '(p OR NOT q) IMP r',
    ];
    const tpl = pick(templates);
    const map = randomVarMap(['p', 'q', 'r']);
    const node = substitute(parseExpr(tpl), map);
    const vars = [map.p, map.q, map.r];
    const tt = truthTable(node, vars);
    const rowIdx = Math.floor(Math.random() * tt.rows.length);
    const row = tt.rows[rowIdx];
    const assignStr = vars.map(v => `${v}=${row.assign[v] ? 'T' : 'F'}`).join(', ');
    return {
      qtype: 'tf', difficulty: 'medium', topic: 'Truth Tables',
      prompt: `For the expression ${toStr(node)}, with ${assignStr}, is the result True or False?`,
      correct: row.value,
      explanation: `Substituting ${assignStr} into ${toStr(node)} and evaluating step by step (respecting precedence ¬ > ∧ > ∨ > →) gives ${row.value ? 'True' : 'False'}.`,
      mistakeTag: 'truth-tables',
      fullTable: forceCells ? tt : undefined,
    };
  }

  // full truth-table completion type (grid input)
  function genTruthTableCompletion() {
    const templates = ['p AND (q OR r)', '(p OR q) IMP r', 'p XOR (q AND r)', 'NOT (p AND q) OR NOT r', '(p IMP q) AND (q IMP r)'];
    const tpl = pick(templates);
    const map = randomVarMap(['p', 'q', 'r']);
    const node = substitute(parseExpr(tpl), map);
    const vars = [map.p, map.q, map.r];
    const tt = truthTable(node, vars);
    // hide 3 random cells for the student to fill
    const hideIdx = pickN([0, 1, 2, 3, 4, 5, 6, 7], 3).sort((a, b) => a - b);
    return {
      qtype: 'truthtable', difficulty: 'medium', topic: 'Truth Tables',
      prompt: `Complete the missing cells (marked ?) in the truth table for ${toStr(node)}.`,
      vars, exprStr: toStr(node),
      rows: tt.rows.map(r => ({ assign: r.assign, value: r.value })),
      hideIdx,
      explanation: `Each row is evaluated by substituting the row's truth values into ${toStr(node)} and applying the operator definitions in order of precedence.`,
      mistakeTag: 'truth-tables',
    };
  }

  // M-4: Converse / inverse / contrapositive
  function genConverseInverse() {
    const ctx = pick(DATA.CONTEXTS);
    const map = randomVarMap(['p', 'q']);
    const kind = pick(['converse', 'inverse', 'contrapositive']);
    const base = `${map.p} → ${map.q}`;
    const forms = {
      converse: `${map.q} → ${map.p}`,
      inverse: `¬${map.p} → ¬${map.q}`,
      contrapositive: `¬${map.q} → ¬${map.p}`,
    };
    const correctStr = forms[kind];
    const options = shuffle(Object.values(forms).concat([base])).filter((v, i, a) => a.indexOf(v) === i);
    return {
      qtype: 'mcq', difficulty: 'medium', topic: 'Converse / Inverse / Contrapositive',
      prompt: `Given the conditional statement "${map.p} → ${map.q}" (If ${ctx.p}, then ${ctx.q}), which expression is its ${kind}?`,
      options, correct: options.indexOf(correctStr),
      explanation: `The ${kind} of p → q is ${correctStr.replace(new RegExp(map.p, 'g'), 'p').replace(new RegExp(map.q, 'g'), 'q')}. Converse swaps p and q; inverse negates both without swapping; contrapositive negates both AND swaps — and the contrapositive is always logically equivalent to the original conditional, while the converse and inverse are only equivalent to each other, not to the original.`,
      mistakeTag: 'converse-inverse-contrapositive',
    };
  }

  // M-4b: Which pair is logically equivalent (converse/inverse/contrapositive concept check)
  function genCICEquivalencePair() {
    const map = randomVarMap(['p', 'q']);
    const pairs = [
      { a: `${map.p} → ${map.q}`, b: `¬${map.q} → ¬${map.p}`, equiv: true, label: 'a conditional and its contrapositive' },
      { a: `${map.p} → ${map.q}`, b: `${map.q} → ${map.p}`, equiv: false, label: 'a conditional and its converse' },
      { a: `${map.p} → ${map.q}`, b: `¬${map.p} → ¬${map.q}`, equiv: false, label: 'a conditional and its inverse' },
      { a: `${map.q} → ${map.p}`, b: `¬${map.p} → ¬${map.q}`, equiv: true, label: 'a converse and its corresponding inverse' },
    ];
    const item = pick(pairs);
    return {
      qtype: 'tf', difficulty: 'medium', topic: 'Converse / Inverse / Contrapositive',
      prompt: `True or False: "${item.a}" and "${item.b}" (${item.label}) always have the same truth value.`,
      correct: item.equiv,
      explanation: item.equiv
        ? `Correct — these are logically equivalent (verifiable by truth table): a conditional and its contrapositive always match, and so do a statement's converse and inverse (since the inverse is the contrapositive of the converse).`
        : `These are NOT equivalent in general — a conditional and its converse (or inverse) can differ in truth value. Only a conditional and its contrapositive are guaranteed equivalent.`,
      mistakeTag: 'converse-inverse-contrapositive',
    };
  }

  // M-5: Tautology / Contradiction / Contingency classification
  function genClassification(hard) {
    const easyPool = ['p OR NOT p', 'p AND NOT p', 'p AND q', 'p OR q', 'p IMP p', 'p AND (NOT p OR q)'];
    const hardPool = ['(p AND q) IMP (p OR q)', '(p IMP q) IFF (NOT p OR q)', '(p OR q) AND (NOT p AND NOT q)', '(p IMP q) AND (p AND NOT q)', 'p XOR p', '(p IFF q) OR (p XOR q)', '((p IMP q) AND p) IMP q'];
    const tpl = pick(hard ? hardPool : easyPool);
    const map = randomVarMap(['p', 'q']);
    const node = substitute(parseExpr(tpl), map);
    const cls = classify(node);
    const options = ['Tautology', 'Contradiction', 'Contingency'];
    const correctIdx = { tautology: 0, contradiction: 1, contingency: 2 }[cls];
    return {
      qtype: 'mcq', difficulty: hard ? 'hard' : 'medium', topic: 'Tautology / Contradiction / Contingency',
      prompt: `Is the statement ${toStr(node)} a tautology, a contradiction, or a contingency?`,
      options, correct: correctIdx,
      explanation: `Building the truth table for ${toStr(node)} shows it is ${cls === 'tautology' ? 'always True (a tautology)' : cls === 'contradiction' ? 'always False (a contradiction)' : 'True for some rows and False for others (a contingency)'}.`,
      mistakeTag: 'tautology-classification',
      showTable: node,
    };
  }

  // M-6: Equivalence determination between two expressions (via truth table)
  function genEquivalenceCheck() {
    const equivPairs = [
      ['NOT (p AND q)', 'NOT p OR NOT q'], ['NOT (p OR q)', 'NOT p AND NOT q'],
      ['p IMP q', 'NOT p OR q'], ['p IMP q', 'NOT q IMP NOT p'],
      ['p IFF q', '(p AND q) OR (NOT p AND NOT q)'], ['p OR (p AND q)', 'p'], ['p AND (p OR q)', 'p'],
    ];
    const nonEquivPairs = [
      ['p IMP q', 'q IMP p'], ['p IMP q', 'NOT p IMP NOT q'], ['p OR q', 'p XOR q'],
      ['p IMP q', 'p AND q'], ['NOT (p AND q)', 'NOT p AND NOT q'], ['p XOR q', 'p IFF q'],
    ];
    const useEquiv = Math.random() < 0.5;
    const [a, b] = pick(useEquiv ? equivPairs : nonEquivPairs);
    const map = randomVarMap(['p', 'q']);
    const na = substitute(parseExpr(a), map), nb = substitute(parseExpr(b), map);
    const isEq = equivalent(na, nb);
    return {
      qtype: 'tf', difficulty: 'medium', topic: 'Logical Equivalence',
      prompt: `True or False: ${toStr(na)}  ≡  ${toStr(nb)}`,
      correct: isEq,
      explanation: isEq
        ? `These are logically equivalent — every row of their truth tables matches.`
        : `These are NOT equivalent — at least one row of their truth tables differs. A common trap: OR is not the same as XOR (OR is true when both are true; XOR is false in that case), and p → q is not equivalent to its converse q → p.`,
      mistakeTag: isEq ? 'equivalence-laws' : 'or-vs-xor',
      pairNodes: [na, nb],
    };
  }

  // M-7: consistency of a 2-spec system (medium)
  function genConsistencySimple() {
    const scenario = pick(DATA.CONSISTENCY_SCENARIOS);
    const map = randomVarMap(['p', 'q']);
    const specs = scenario.consistentSet.map(s => toStr(substitute(parseExpr(s.replace(/¬/g, 'NOT ')), map)));
    return {
      qtype: 'tf', difficulty: 'medium', topic: 'System Specification Consistency',
      prompt: `Let ${map.p} = "${scenario.pLabel}" and ${map.q} = "${scenario.qLabel}".\n\nAre these specifications consistent?\n${specs.map((s, i) => `${i + 1}. ${s}`).join('\n')}`,
      correct: true,
      explanation: `${scenario.note.replace(/p/g, map.p).replace(/q/g, map.q)} Since some assignment of truth values makes all the specifications simultaneously True, the set is consistent.`,
      mistakeTag: 'consistency',
    };
  }

  // M-8: common-mistake targeted (p->q vs q->p / OR vs XOR / "only if" direction)
  function genCommonMistakeCheck() {
    const kind = pick(['direction', 'onlyif', 'orxor', 'falsecond']);
    const map = randomVarMap(['p', 'q']);
    if (kind === 'direction') {
      return {
        qtype: 'tf', difficulty: 'medium', topic: 'Conditional Statements',
        prompt: `True or False: the statement "${map.p} → ${map.q}" always has the exact same truth value as "${map.q} → ${map.p}".`,
        correct: false,
        explanation: `False — p → q and its converse q → p are NOT logically equivalent in general. For example, when p is False and q is True, p → q is True but q → p is False.`,
        mistakeTag: 'p-vs-q-implication',
      };
    }
    if (kind === 'onlyif') {
      const options = shuffle([`${map.p} → ${map.q}`, `${map.q} → ${map.p}`]);
      const correctText = `${map.p} → ${map.q}`;
      return {
        qtype: 'mcq', difficulty: 'medium', topic: 'Conditional Statements',
        prompt: `"${map.p} only if ${map.q}" is best translated as:`,
        options,
        correct: options.indexOf(correctText),
        explanation: `"p only if q" means p → q, NOT q → p. This is one of the most common translation mistakes — do not use "q only if p" to express p → q.`,
        mistakeTag: 'only-if-direction',
      };
    }
    if (kind === 'orxor') {
      const pv = true, qv = true;
      return {
        qtype: 'tf', difficulty: 'medium', topic: 'Operators & Truth Values',
        prompt: `If ${map.p} = True and ${map.q} = True, is "${map.p} ∨ ${map.q}" True?`,
        correct: true,
        explanation: `True. Disjunction (∨) is true whenever at least one side is true — including when both are true. Only exclusive or (⊕) would be False here, since ⊕ requires exactly one side to be true.`,
        mistakeTag: 'or-vs-xor',
      };
    }
    // falsecond: p false, does p->q automatically true?
    return {
      qtype: 'mcq', difficulty: 'medium', topic: 'Conditional Statements',
      prompt: `If ${map.p} = False and ${map.q} = False, what is the truth value of "${map.p} → ${map.q}"?`,
      options: ['True', 'False', 'Cannot be determined'],
      correct: 0,
      explanation: `p → q is False only when p is True and q is False. In every other case (including p False, q False) it is True. A common mistake is assuming p → q is automatically False whenever q is False — but the premise's truth value matters too.`,
      mistakeTag: 'false-antecedent',
    };
  }

  // ============================================================
  // HARD GENERATORS
  // ============================================================

  // H-1: full symbolic step-by-step proof with law selection (multiple choice per step)
  function genProof() {
    const tpl = pick(DATA.PROOF_TEMPLATES);
    const nativeVars = Array.from(Logic.collectVars(parseExpr(tpl.start.replace(/T|F/g, m => m))));
    const map = randomVarMap(nativeVars.filter(v => v !== 't' && v !== 'f'));
    const startNode = substitute(parseExpr(tpl.start), map);
    const endNode = substitute(parseExpr(tpl.end), map);
    const steps = tpl.steps.map(s => ({
      expr: toStr(substitute(parseExpr(s.expr), map)),
      law: s.law,
      lawName: DATA.LAW_BY_ID[s.law].name,
    }));
    return {
      qtype: 'proof', difficulty: 'hard', topic: 'Proving Equivalence (Logical Laws)',
      prompt: `Prove that ${toStr(startNode)} ≡ ${toStr(endNode)}${tpl.isTautology ? ' (i.e. show it is a Tautology)' : ''} using logical equivalence laws. For each step, select the law that justifies the transformation.`,
      startExpr: toStr(startNode), endExpr: toStr(endNode),
      steps, // {expr, law, lawName}
      lawChoices: DATA.LAWS,
      explanation: `Full derivation:\n${toStr(startNode)}\n` + steps.map(s => `≡ ${s.expr}   [${s.lawName}]`).join('\n'),
      mistakeTag: 'equivalence-laws',
      src: tpl.src,
    };
  }

  // H-2: consistency analysis with an added inconsistent requirement (hard)
  function genConsistencyHard() {
    const scenario = pick(DATA.CONSISTENCY_SCENARIOS);
    const map = randomVarMap(['p', 'q']);
    const withAddition = Math.random() < 0.6;
    const specs = scenario.consistentSet.map(s => toStr(substitute(parseExpr(s.replace(/¬/g, 'NOT ')), map)));
    if (withAddition) specs.push(toStr(substitute(parseExpr(scenario.inconsistentAddition.replace(/¬/g, 'NOT ')), map)));
    // verify programmatically
    const nodes = specs.map(s => parseExpr(s));
    const vars = Array.from(new Set(nodes.flatMap(n => Array.from(Logic.collectVars(n))))).sort();
    let consistent = false;
    for (let i = 0; i < (1 << vars.length); i++) {
      const assign = {}; vars.forEach((v, idx) => assign[v] = !!((i >> (vars.length - 1 - idx)) & 1));
      if (nodes.every(n => evalNode(n, assign))) { consistent = true; break; }
    }
    return {
      qtype: 'consistency', difficulty: 'hard', topic: 'System Specification Consistency',
      prompt: `Let ${map.p} = "${scenario.pLabel}" and ${map.q} = "${scenario.qLabel}".\n\nDetermine whether this set of system specifications is consistent:\n${specs.map((s, i) => `${i + 1}. ${s}`).join('\n')}`,
      correct: consistent,
      explanation: consistent
        ? `Consistent. ${scenario.note.replace(/\bp\b/g, map.p).replace(/\bq\b/g, map.q)}`
        : `Inconsistent. No assignment of truth values to ${vars.join(', ')} makes every specification True simultaneously — check each combination against all ${specs.length} statements.`,
      mistakeTag: 'consistency',
      specs,
    };
  }

  // H-3: classify a nested/complex expression (reuses genClassification hard pool)
  function genHardClassification() { return genClassification(true); }

  // H-4: nested equivalence determination (3-variable) — the correct option must be a
  // *different textual form* that is nonetheless equivalent to the stem expression;
  // reusing hand-verified equivalence pairs guarantees this rather than ever repeating
  // the stem's own string as an option.
  const HARD_EQUIV_PAIRS = [
    ['NOT (p AND q)', 'NOT p OR NOT q'],
    ['NOT (p OR q)', 'NOT p AND NOT q'],
    ['p IMP (q OR r)', 'NOT p OR (q OR r)'],
    ['(p OR q) IMP r', 'NOT p AND NOT q OR r'],
    ['NOT p OR (q AND r)', 'p IMP (q AND r)'],
    ['p AND (q OR r)', '(p AND q) OR (p AND r)'],
    ['NOT (p IMP q)', 'p AND NOT q'],
  ];
  function genHardEquivalenceSelect() {
    const [stemTpl, correctTpl] = pick(HARD_EQUIV_PAIRS);
    const nativeVars = Array.from(Logic.collectVars(parseExpr(stemTpl)));
    const map = randomVarMap(nativeVars);
    const stemNode = substitute(parseExpr(stemTpl), map);
    const correctNode = substitute(parseExpr(correctTpl), map);
    const stemStr = toStr(stemNode);
    const correctStr = toStr(correctNode);

    // Build distractors: mutate the correct form (flip a top operator, negate a side,
    // or swap a non-commutative implication's direction) so they are NOT equivalent to
    // the stem. The mcq validator will still re-verify and reject if anything slips through.
    const mutations = [
      flipTopOp(correctNode),
      negateOneSide(correctNode),
    ];
    if (correctNode.op === 'IMP') mutations.push({ op: 'IMP', a: correctNode.b, b: correctNode.a });
    if (correctNode.b && (correctNode.b.op === 'OR' || correctNode.b.op === 'AND')) {
      mutations.push({ op: correctNode.op, a: correctNode.a, b: flipTopOp(correctNode.b) });
    }
    let distractorStrs = [];
    mutations.forEach(m => {
      let s; try { s = toStr(m); } catch (e) { return; }
      if (s === stemStr || s === correctStr) return;
      let eq = false; try { eq = equivalent(m, stemNode); } catch (e) { }
      if (eq) return;
      distractorStrs.push(s);
    });
    distractorStrs = shuffle(distractorStrs.filter((v, i, a) => a.indexOf(v) === i)).slice(0, 3);
    // top up with generic contingencies if we don't have 3 distinct, non-equivalent distractors
    const fillerPool = ['p AND q', 'p OR NOT r', 'q IMP r', 'NOT p AND q', 'p XOR q'];
    let fi = 0;
    while (distractorStrs.length < 3 && fi < fillerPool.length) {
      const cand = toStr(substitute(parseExpr(fillerPool[fi]), map));
      fi++;
      if (cand === stemStr || cand === correctStr || distractorStrs.includes(cand)) continue;
      let eq = false; try { eq = equivalent(parseExpr(cand), stemNode); } catch (e) { }
      if (eq) continue;
      distractorStrs.push(cand);
    }
    const options = shuffle([correctStr, ...distractorStrs]);
    return {
      qtype: 'selectexpr', difficulty: 'hard', topic: 'Logical Equivalence',
      prompt: `Which of the following expressions is logically equivalent to ${stemStr}? (The correct option is written in a different but equivalent form — verify by truth table or equivalence laws, not by matching text.)`,
      options,
      correct: options.indexOf(correctStr),
      explanation: `${correctStr} is logically equivalent to ${stemStr} — their truth tables match on every assignment. The other options differ in at least one row.`,
      mistakeTag: 'equivalence-laws',
      _node: stemNode,
    };
  }

  // M-9 / E-5: Symbolic expression input — type the translation, graded by equivalence
  function genSymbolicInput(tier) {
    let item, legend, promptText;
    if (tier === 'easy') {
      const bank = pick([
        { list: DATA.WEATHER_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'weather') },
        { list: DATA.SPEEDING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'speeding') },
        { list: DATA.FREEZING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'freezing') },
      ]);
      const simpleOnes = bank.list.filter(it => (it.expr.match(/AND|OR|IMP|IFF/g) || []).length <= 1);
      item = pick(simpleOnes.length ? simpleOnes : bank.list);
      const map = randomVarMap(['p', 'q']);
      const node = substitute(parseExpr(item.expr), map);
      legend = `${map.p} = "${bank.ctx.p}"; ${map.q} = "${bank.ctx.q}"`;
      promptText = item.text;
      return {
        qtype: 'symbolic', difficulty: 'easy', topic: 'Translation',
        prompt: `Let ${legend}.\n\nType the symbolic expression for:\n“${promptText}”`,
        targetExpr: toStr(node),
        explanation: `“${promptText}” translates to ${toStr(node)}. Any logically equivalent way of writing it (different but equivalent parenthesization, or an equivalent rearrangement) is also accepted.`,
        mistakeTag: 'translation',
      };
    }
    if (tier === 'medium') {
      const useMulti = Math.random() < 0.5;
      if (useMulti) {
        item = pick(DATA.MULTI_VAR_TRANSLATIONS);
        const letters = Object.keys(item.vars);
        const map = randomVarMap(letters);
        const node = substitute(parseExpr(item.expr), map);
        legend = letters.map(l => `${map[l]} = "${item.vars[l]}"`).join('; ');
        return {
          qtype: 'symbolic', difficulty: 'medium', topic: 'Translation',
          prompt: `Let ${legend}.\n\nType the symbolic expression for:\n“${item.text}”`,
          targetExpr: toStr(node),
          explanation: `“${item.text}” translates to ${toStr(node)}. Watch for "only if" (→, not ←) and "unless".`,
          mistakeTag: 'translation',
        };
      } else {
        const bank = pick([
          { list: DATA.WEATHER_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'weather') },
          { list: DATA.SPEEDING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'speeding') },
          { list: DATA.FREEZING_TRANSLATIONS, ctx: DATA.CONTEXTS.find(c => c.id === 'freezing') },
        ]);
        item = pick(bank.list);
        const map = randomVarMap(['p', 'q']);
        const node = substitute(parseExpr(item.expr), map);
        return {
          qtype: 'symbolic', difficulty: 'medium', topic: 'Translation',
          prompt: `Let ${map.p} = "${bank.ctx.p}" and ${map.q} = "${bank.ctx.q}".\n\nType the symbolic expression for:\n“${item.text}”`,
          targetExpr: toStr(node),
          explanation: `“${item.text}” translates to ${toStr(node)}.`,
          mistakeTag: 'translation',
        };
      }
    }
    // hard: type an equivalent form using only ¬, ∧, ∨ (eliminate → via the Implication law)
    const impPool = ['p IMP q', '(p AND q) IMP r', 'p IMP (q OR r)', 'NOT p IMP (q AND r)'];
    const tpl = pick(impPool);
    const nativeVars = Array.from(Logic.collectVars(parseExpr(tpl)));
    const map = randomVarMap(nativeVars);
    const node = substitute(parseExpr(tpl), map);
    const targetNode = eliminateImplications(node);
    return {
      qtype: 'symbolic', difficulty: 'hard', topic: 'Proving Equivalence (Logical Laws)',
      prompt: `Type an expression logically equivalent to ${toStr(node)} that uses only ¬, ∧, and ∨ (no →), by applying the Definition of Implication (p → q ≡ ¬p ∨ q).`,
      targetExpr: toStr(targetNode),
      explanation: `Applying p → q ≡ ¬p ∨ q throughout gives ${toStr(targetNode)}, which is logically equivalent to ${toStr(node)} and uses only ¬, ∧, ∨.`,
      mistakeTag: 'equivalence-laws',
    };
  }
  function eliminateImplications(node) {
    if (node.op === 'VAR' || node.op === 'TRUE' || node.op === 'FALSE') return node;
    if (node.op === 'NOT') return { op: 'NOT', a: eliminateImplications(node.a) };
    if (node.op === 'IMP') return { op: 'OR', a: { op: 'NOT', a: eliminateImplications(node.a) }, b: eliminateImplications(node.b) };
    return { op: node.op, a: eliminateImplications(node.a), b: eliminateImplications(node.b) };
  }

  // ============================================================
  // DISPATCH TABLE
  // ============================================================
  const EASY_GENS = [genPropClassify, genBasicOperatorEval, genSimpleTranslation, genLogicGate, () => genSymbolicInput('easy')];
  const MEDIUM_GENS = [genComplexTranslation, genNecessarySufficient, () => genTruthTableQuestion(false), genTruthTableCompletion,
    genConverseInverse, genCICEquivalencePair, () => genClassification(false), genEquivalenceCheck, genConsistencySimple, genCommonMistakeCheck, () => genSymbolicInput('medium')];
  const HARD_GENS = [genProof, genConsistencyHard, genHardClassification, genHardEquivalenceSelect, () => genSymbolicInput('hard')];

  function generateOne(difficulty) {
    const pool = difficulty === 'easy' ? EASY_GENS : difficulty === 'medium' ? MEDIUM_GENS : HARD_GENS;
    let attempt = 0, q = null;
    while (attempt < 8) {
      try {
        q = pick(pool)();
        if (validateQuestion(q)) break;
        q = null;
      } catch (e) { q = null; }
      attempt++;
    }
    if (!q) { // fallback guaranteed-valid question
      q = genBasicOperatorEval();
    }
    q.id = uid();
    q.flagged = false;
    q.userAnswer = null;
    return q;
  }

  // Validation layer: re-derive correctness programmatically before accepting a question (Section 8 requirement)
  function validateQuestion(q) {
    if (!q) return false;
    if (q.qtype === 'mcq') {
      if (!Array.isArray(q.options) || q.options.length < 2) return false;
      if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length) return false;
      // Defense-in-depth: if every option parses as a logic expression, make sure
      // exactly one is semantically equivalent to the correct option (no ambiguity,
      // no accidental duplicate "correct" answers among the distractors).
      const parsed = q.options.map(o => Logic.tryParse(o));
      if (parsed.every(p => p.ok)) {
        const correctNode = parsed[q.correct].node;
        const matches = parsed.filter(p => equivalent(p.node, correctNode)).length;
        if (matches !== 1) return false;
      }
      // also reject literal duplicate option text
      if (new Set(q.options).size !== q.options.length) return false;
      return true;
    }
    if (q.qtype === 'tf') return typeof q.correct === 'boolean';
    if (q.qtype === 'truthtable') return Array.isArray(q.rows) && q.rows.length > 0;
    if (q.qtype === 'proof') return Array.isArray(q.steps) && q.steps.every(s => s.law && DATA.LAW_BY_ID[s.law]);
    if (q.qtype === 'consistency') return typeof q.correct === 'boolean';
    if (q.qtype === 'symbolic') {
      if (!q.targetExpr) return false;
      try { parseExpr(q.targetExpr); } catch (e) { return false; }
      return true;
    }
    if (q.qtype === 'selectexpr') {
      // finalize correctness by real equivalence check against node
      if (!q._node) return false;
      const idx = q.options.findIndex(optStr => {
        try { return equivalent(parseExpr(optStr), q._node); } catch (e) { return false; }
      });
      if (idx < 0) return false;
      const dupCount = q.options.filter(optStr => { try { return equivalent(parseExpr(optStr), q._node); } catch (e) { return false; } }).length;
      if (dupCount !== 1) return false; // ambiguous — reject, regenerate (Section 8 rule)
      q.correct = idx;
      q.explanation = `${q.options[idx]} is logically equivalent to ${toStr(q._node)} — verified by matching truth tables across all variable assignments. The other options differ in at least one row.`;
      delete q._node;
      return true;
    }
    return false;
  }

  function generateExam(n) {
    n = n || 20;
    const nEasy = Math.round(n * 0.30), nMedium = Math.round(n * 0.45);
    const nHard = n - nEasy - nMedium;
    const diffList = shuffle([
      ...Array(nEasy).fill('easy'),
      ...Array(nMedium).fill('medium'),
      ...Array(nHard).fill('hard'),
    ]);
    return diffList.map(d => generateOne(d));
  }

  function generateByTopicPool(topicFilterFn, count, difficulty) {
    const out = [];
    let guard = 0;
    while (out.length < count && guard < count * 20) {
      const d = difficulty || pick(['easy', 'medium', 'hard']);
      const q = generateOne(d);
      if (!topicFilterFn || topicFilterFn(q)) out.push(q);
      guard++;
    }
    return out;
  }

  return { generateOne, generateExam, generateByTopicPool, VARPOOL };
})();

<script>
// ============================================================
// Storage, exam engine, scoring & weakness analysis
// ============================================================
const Store = (function () {
  const KEYS = { history: 'lsd_history_v1', mistakes: 'lsd_mistakes_v1', theme: 'lsd_theme_v1', inprogress: 'lsd_inprogress_v1' };
  function get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { console.warn('storage failed', e); return false; }
  }
  function remove(key) { try { localStorage.removeItem(key); } catch (e) { } }

  return {
    getHistory: () => get(KEYS.history, []),
    saveHistory: (h) => set(KEYS.history, h),
    addHistoryEntry: (entry) => { const h = get(KEYS.history, []); h.unshift(entry); set(KEYS.history, h.slice(0, 100)); },
    getMistakes: () => get(KEYS.mistakes, {}),
    saveMistakes: (m) => set(KEYS.mistakes, m),
    getTheme: () => get(KEYS.theme, null),
    saveTheme: (t) => set(KEYS.theme, t),
    getInProgress: () => get(KEYS.inprogress, null),
    saveInProgress: (s) => set(KEYS.inprogress, s),
    clearInProgress: () => remove(KEYS.inprogress),
    KEYS,
  };
})();

const MISTAKE_LABELS = {
  'prop-vs-nonprop': 'Identifying propositions vs. non-propositions',
  'operator-precedence': 'Operator precedence & basic evaluation',
  'translation': 'Translating English to symbolic logic',
  'logic-gates': 'Reading logic gate diagrams',
  'necessary-sufficient': 'Necessary vs. sufficient conditions',
  'truth-tables': 'Constructing / reading truth tables',
  'converse-inverse-contrapositive': 'Converse, inverse & contrapositive',
  'tautology-classification': 'Tautology / contradiction / contingency',
  'equivalence-laws': 'Applying logical equivalence laws',
  'consistency': 'System specification consistency',
  'or-vs-xor': 'Confusing OR with exclusive-OR (XOR)',
  'p-vs-q-implication': 'Confusing p → q with its converse q → p',
  'only-if-direction': '"p only if q" direction',
  'false-antecedent': 'Assuming p → q is false whenever q is false',
};

const Exam = (function () {
  function buildExam(n, seedMode) {
    return {
      id: 'exam_' + Date.now(),
      mode: seedMode || 'mock',
      questions: QGEN.generateExam(n || 20),
      currentIndex: 0,
      startedAt: Date.now(),
      durationSec: 30 * 60,
      submitted: false,
    };
  }

  function buildPractice(questions, timed, durationSec) {
    return {
      id: 'practice_' + Date.now(),
      mode: 'practice',
      questions,
      currentIndex: 0,
      startedAt: Date.now(),
      durationSec: timed ? (durationSec || 15 * 60) : null,
      submitted: false,
    };
  }

  function elapsedSec(session) { return Math.floor((Date.now() - session.startedAt) / 1000); }
  function remainingSec(session) {
    if (session.durationSec == null) return null;
    return Math.max(0, session.durationSec - elapsedSec(session));
  }

  function gradeQuestion(q) {
    if (q.userAnswer === null || q.userAnswer === undefined) return false;
    switch (q.qtype) {
      case 'mcq': return q.userAnswer === q.correct;
      case 'tf': return q.userAnswer === q.correct;
      case 'selectexpr': return q.userAnswer === q.correct;
      case 'consistency': return q.userAnswer === q.correct;
      case 'truthtable': {
        // userAnswer: {idx: boolean}
        if (!q.userAnswer) return false;
        return q.hideIdx.every(i => q.userAnswer[i] === q.rows[i].value);
      }
      case 'symbolic': {
        if (!q.userAnswer) return false;
        const parsed = Logic.tryParse(q.userAnswer);
        if (!parsed.ok) return false;
        try { return Logic.equivalent(parsed.node, Logic.parseExpr(q.targetExpr)); } catch (e) { return false; }
      }
      case 'proof': {
        if (!q.userAnswer || !Array.isArray(q.userAnswer)) return false;
        return q.steps.every((s, i) => q.userAnswer[i] === s.law);
      }
      default: return false;
    }
  }

  function partialProofScore(q) {
    if (q.qtype !== 'proof' || !q.userAnswer) return { correct: 0, total: q.steps.length };
    let c = 0;
    q.steps.forEach((s, i) => { if (q.userAnswer[i] === s.law) c++; });
    return { correct: c, total: q.steps.length };
  }

  function scoreSession(session) {
    let correctCount = 0;
    const byDifficulty = { easy: { c: 0, t: 0 }, medium: { c: 0, t: 0 }, hard: { c: 0, t: 0 } };
    const byTopic = {};
    const byType = {};
    const mistakeTags = {};
    session.questions.forEach(q => {
      const isCorrect = gradeQuestion(q);
      q._isCorrect = isCorrect;
      if (isCorrect) correctCount++;
      byDifficulty[q.difficulty].t++; if (isCorrect) byDifficulty[q.difficulty].c++;
      byTopic[q.topic] = byTopic[q.topic] || { c: 0, t: 0 }; byTopic[q.topic].t++; if (isCorrect) byTopic[q.topic].c++;
      byType[q.qtype] = byType[q.qtype] || { c: 0, t: 0 }; byType[q.qtype].t++; if (isCorrect) byType[q.qtype].c++;
      if (!isCorrect && q.mistakeTag) mistakeTags[q.mistakeTag] = (mistakeTags[q.mistakeTag] || 0) + 1;
    });
    return {
      correctCount, total: session.questions.length,
      percent: Math.round((correctCount / session.questions.length) * 100),
      byDifficulty, byTopic, byType, mistakeTags,
    };
  }

  function persistMistakes(mistakeTags) {
    const existing = Store.getMistakes();
    Object.keys(mistakeTags).forEach(tag => { existing[tag] = (existing[tag] || 0) + mistakeTags[tag]; });
    Store.saveMistakes(existing);
  }

  function toHistoryEntry(session, scoreObj) {
    return {
      id: session.id,
      date: Date.now(),
      mode: session.mode,
      score: scoreObj.correctCount,
      total: scoreObj.total,
      percent: scoreObj.percent,
      timeUsedSec: elapsedSec(session),
      durationSec: session.durationSec,
      byDifficulty: scoreObj.byDifficulty,
      byTopic: scoreObj.byTopic,
      byType: scoreObj.byType,
      mistakeTags: scoreObj.mistakeTags,
      questions: session.questions,
    };
  }

  return { buildExam, buildPractice, elapsedSec, remainingSec, gradeQuestion, partialProofScore, scoreSession, persistMistakes, toHistoryEntry };
})();

function fmtTime(sec) {
  if (sec == null) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

// ============================================================
// UI Application: state, router, renderers, event delegation
// ============================================================
const App = (function () {
  const state = {
    view: 'dashboard',
    session: null,        // active exam/practice session
    lastEntry: null,      // last completed history entry (for results view)
    reviewEntry: null,    // history entry being viewed from History list
    timerId: null,
    practiceDraft: { mode: 'topic', topic: null, difficulty: null, count: 10, timed: false },
  };

  const TOPICS = [
    'Propositions', 'Operators & Truth Values', 'Translation', 'Conditional Statements',
    'Truth Tables', 'Converse / Inverse / Contrapositive', 'Tautology / Contradiction / Contingency',
    'Logical Equivalence', 'System Specification Consistency', 'Logic Gates', 'Proving Equivalence (Logical Laws)',
  ];

  function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

  // ---------------- THEME ----------------
  function initTheme() {
    const saved = Store.getTheme();
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    Store.saveTheme(t);
    renderShellChrome();
  }
  function cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    const cur = Store.getTheme() || 'auto';
    const next = order[(order.indexOf(cur) + 1) % order.length];
    setTheme(next);
  }

  // ---------------- ROUTER ----------------
  function goto(view, opts) {
    if (state.session && !state.session.submitted && state.view === 'exam' && view !== 'exam') {
      openLeaveConfirm(view, opts);
      return;
    }
    state.view = view;
    Object.assign(state, opts || {});
    render();
    window.scrollTo(0, 0);
  }

  function openLeaveConfirm(view, opts) {
    state._pendingNav = { view, opts };
    const root = document.getElementById('modal-root');
    root.innerHTML = '';
    root.appendChild(el(`
      <div class="modal-overlay">
        <div class="modal-box">

  function render() {
    renderShellChrome();
    const main = document.getElementById('main-content');
    main.innerHTML = '';
    let node;
    switch (state.view) {
      case 'dashboard': node = renderDashboard(); break;
      case 'exam': node = renderExamSession(); break;
      case 'results': node = renderResults(state.lastEntry); break;
      case 'practice-setup': node = renderPracticeSetup(); break;
      case 'weaknesses': node = renderWeaknesses(); break;
      case 'history': node = renderHistory(); break;
      case 'history-detail': node = renderResults(state.reviewEntry, true); break;
      default: node = renderDashboard();
    }
    main.appendChild(node);
    manageTimer();
  }

    if (label) label.textContent = 'Theme: ' + themeSaved[0].toUpperCase() + themeSaved.slice(1);
  }
